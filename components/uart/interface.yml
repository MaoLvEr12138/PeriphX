component: uart

services:
  - name: configure
    type: u32
    access: input
    description: "写入UART运行时配置"

  - name: write_byte
    type: u8
    access: input
    description: "写入1字节到UART TX FIFO"

  - name: read_byte
    type: u8
    access: output
    description: "从UART RX FIFO读取1字节"

  - name: get_status
    type: u32
    access: output
    description: "读取UART状态"
